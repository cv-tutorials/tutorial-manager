<style>
 :root{ --navy:__PRIMARY__; --navy-dk:#0E132F; --red:__ACCENT__; --red-dk:#8f0a25;
   --ink:#11161A; --slate:#333F48; --muted:#5E6B76; --line:#D8DEE3; --surf:#F4F6F8;
   --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
 *{box-sizing:border-box; margin:0; padding:0}
 body{font-family:var(--font); color:var(--ink); background:var(--navy-dk);
   min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
   -webkit-font-smoothing:antialiased}
 .shell{width:100%; max-width:960px; background:#fff; border-radius:16px; overflow:hidden;
   box-shadow:0 30px 70px -28px rgba(0,0,0,.6)}
 .top{display:flex; align-items:center; gap:14px; padding:15px 24px; border-bottom:1px solid var(--line)}
 .top>img{height:30px; flex:none}
 .top .div{width:1px; height:26px; background:var(--line); flex:none}
 .ttl{flex:1; min-width:0}
 .ttl h1{font-size:15.5px; font-weight:700; letter-spacing:-.3px; color:var(--navy); line-height:1.15}
 .ttl p{font-size:11px; color:var(--muted); margin-top:3px; text-transform:uppercase; letter-spacing:.7px}
 .ttl.hide{visibility:hidden}
 .lang{display:flex; border:1px solid var(--line); border-radius:999px; padding:3px; flex:none}
 .lang button{border:0; background:transparent; color:var(--muted); font-weight:700; font-size:11.5px;
   padding:5px 12px; border-radius:999px; cursor:pointer; letter-spacing:.4px}
 .lang button.on{background:var(--navy); color:#fff}

 /* INTRO */
 #vIntro{padding:48px 40px 40px; text-align:center}
 .eyebrow{font-size:11.5px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; color:var(--red)}
 #vIntro h2{font-size:34px; font-weight:800; letter-spacing:-1px; color:var(--navy); margin:14px auto 0; max-width:15ch; line-height:1.05}
 #vIntro .lead{font-size:15px; line-height:1.6; color:var(--slate); margin:16px auto 0; max-width:48ch}
 .meta{display:flex; gap:10px; justify-content:center; margin:22px 0 26px; flex-wrap:wrap}
 .chip{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700; color:var(--navy);
   background:var(--surf); border:1px solid var(--line); padding:7px 14px; border-radius:999px}
 .chip i{width:7px; height:7px; border-radius:50%; background:var(--red); display:inline-block}

 /* STEP */
 .seg{display:flex; gap:5px; padding:16px 24px 4px}
 .seg span{flex:1; height:6px; border-radius:999px; background:var(--line); cursor:pointer; transition:.25s}
 .seg span:hover{transform:scaleY(1.6)}
 .seg span.done{background:var(--navy)} .seg span.cur{background:var(--red)}
 .seglbl{padding:8px 24px 0; font-size:11.5px; font-weight:700; color:var(--muted); letter-spacing:.3px}
 .seglbl b{color:var(--navy)}
 .stage{position:relative; margin:12px 24px 0; border-radius:11px; overflow:hidden; border:1px solid var(--line); background:#eceff1}
 .canvas{position:relative; transform-origin:var(--ox,50%) var(--oy,50%); transition:transform .5s cubic-bezier(.4,0,.2,1)}
 .canvas img{display:block; width:100%; height:auto}
 .expand{position:absolute; top:10px; right:10px; z-index:5; width:34px; height:34px; border:0; border-radius:8px;
   background:rgba(14,19,47,.6); cursor:pointer; display:grid; place-items:center; transition:.15s}
 .expand:hover{background:rgba(14,19,47,.85)}
 .expand svg{width:17px; height:17px; stroke:#fff; stroke-width:2; fill:none}
 .lb{position:fixed; inset:0; background:rgba(14,19,47,.93); display:none; z-index:99; align-items:center; justify-content:center; padding:30px; cursor:zoom-out}
 .lb.open{display:flex}
 .lb img{max-width:100%; max-height:100%; border-radius:8px; box-shadow:0 24px 70px rgba(0,0,0,.55)}
 .lb .x{position:absolute; top:16px; right:20px; width:42px; height:42px; border:0; border-radius:10px; background:rgba(255,255,255,.14); color:#fff; font-size:24px; line-height:1; cursor:pointer}
 .lb .x:hover{background:rgba(255,255,255,.26)}
 .spot{position:absolute; border-radius:7px; border:3px solid var(--red); cursor:pointer; z-index:3;
   box-shadow:0 0 0 9999px rgba(14,19,47,.6);
   transition:left .4s cubic-bezier(.4,0,.2,1),top .4s cubic-bezier(.4,0,.2,1),width .4s cubic-bezier(.4,0,.2,1),height .4s cubic-bezier(.4,0,.2,1)}
 .spot::after{content:""; position:absolute; inset:-3px; border-radius:9px; border:2px solid var(--red); animation:pulse 2s infinite; pointer-events:none}
 .spot.static{border-color:var(--navy); cursor:default; box-shadow:0 0 0 9999px rgba(14,19,47,.5)}
 .spot.static::after{display:none}
 @keyframes pulse{0%{opacity:.8;transform:scale(1)}70%{opacity:0;transform:scale(1.06)}100%{opacity:0}}
 .blur{position:absolute; z-index:2; border-radius:4px}
 .ctrl{display:flex; align-items:flex-start; gap:18px; padding:18px 24px 6px}
 .num{font-size:42px; font-weight:800; line-height:.82; color:var(--navy); font-variant-numeric:tabular-nums; letter-spacing:-2px; flex:none; min-width:58px}
 .copy{flex:1; min-width:0}
 .copy h3{font-size:17px; font-weight:700; letter-spacing:-.3px; color:var(--navy)}
 .copy p{font-size:13.5px; line-height:1.55; color:var(--slate); margin-top:5px}

 /* DONE */
 #vDone{padding:44px 40px 36px; text-align:center}
 .check{width:64px; height:64px; border-radius:50%; background:var(--navy); display:inline-grid; place-items:center; margin-bottom:18px}
 .check svg{width:30px; height:30px; stroke:#fff; stroke-width:3; fill:none}
 #vDone h2{font-size:27px; font-weight:800; letter-spacing:-.6px; color:var(--navy)}
 #vDone .lead{font-size:14.5px; line-height:1.6; color:var(--slate); margin:12px auto 0; max-width:52ch}

 .nav{display:flex; gap:9px; align-items:center; justify-content:center}
 .nav.step{flex:none; align-self:center}
 #vDone .nav, #vIntro .nav{margin-top:8px}
 .btn{border:1px solid var(--line); background:#fff; color:var(--navy); font-weight:700; font-size:13px;
   padding:10px 18px; border-radius:9px; cursor:pointer; transition:.15s; white-space:nowrap}
 .btn:hover:not(:disabled){border-color:var(--navy)} .btn:disabled{opacity:.4; cursor:not-allowed}
 .btn.pri{background:var(--red); border-color:var(--red); color:#fff}
 .btn.pri:hover{background:var(--red-dk); border-color:var(--red-dk)}
 .btn.lg{padding:13px 26px; font-size:14px}
 .btn:focus-visible{outline:3px solid rgba(0,20,137,.4); outline-offset:2px}

 .foot{margin:16px 24px 18px; padding-top:14px; border-top:1px solid var(--line);
   display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px}
 .power{display:inline-flex; align-items:center; gap:9px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; font-weight:700}
 .power img{height:16px; opacity:.92}
 .help{font-size:13px; color:var(--slate); font-weight:600}
 .help a{color:var(--red); font-weight:700; text-decoration:none} .help a:hover{text-decoration:underline}

 .fade{animation:fade .4s ease both}
 @keyframes fade{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}

 @media (max-width:620px){
   body{padding:10px}
   #vIntro{padding:34px 22px 26px} #vIntro h2{font-size:27px} #vDone{padding:32px 22px 26px}
   .ctrl{flex-wrap:wrap; gap:12px} .num{font-size:34px; min-width:44px}
   .nav.step{width:100%} .nav.step .btn{flex:1}
   .foot{flex-direction:column; align-items:flex-start}
 }
 @media (prefers-reduced-motion:reduce){
   .spot{transition:none}.spot::after{animation:none}.seg span{transition:none}.fade{animation:none}
 }
</style>
</head>

<div class="lb" id="lb" onclick="closeLB()"><button class="x" id="lbx" aria-label="Close">&times;</button><img id="lbimg" alt=""></div>

<script>
 const S=__STEPS__, UI=__UI__, EMAIL="__EMAIL__", N=S.length;
 let lang="en", idx=-1, zoomT;   // -1 intro · 0..N-1 steps · N done
 const LANGS=Object.keys(UI);
 if(LANGS.length<2) document.querySelector(".lang").style.display="none";
 const seg=document.getElementById("seg");
 for(let k=0;k<N;k++){const sp=document.createElement("span");sp.onclick=()=>GO(k);seg.appendChild(sp);}

 function ga(ev,p){if(typeof gtag==="function")gtag("event",ev,p);}
 function L(l){lang=l; ga("tutorial_lang",{language:l}); paint();}
 function GO(n){ idx=n; render(true); }
 function back(){ idx=Math.max(-1, idx-1); render(true); }
 function adv(){ if(idx>=0 && S[idx] && S[idx].static && idx===N-1){ idx=N; } else { idx=Math.min(N, idx+1); } render(true); }

 function fade(el){ el.classList.remove("fade"); void el.offsetWidth; el.classList.add("fade"); }

 function render(anim){
   const intro=document.getElementById("vIntro"), step=document.getElementById("vStep"), done=document.getElementById("vDone");
   intro.style.display = idx===-1?"block":"none";
   step.style.display  = (idx>=0&&idx<N)?"block":"none";
   done.style.display  = idx===N?"block":"none";
   document.getElementById("topTtl").classList.toggle("hide", idx===-1);
   syncHash();
   if(anim){ if(idx===-1) fade(intro); else if(idx===N){ fade(done); ga("tutorial_complete",{steps:N}); } else{ fade(step); ga("tutorial_step",{step:idx+1,total:N}); } }
   paint();
 }

 function paint(){
   const u=UI[lang];
   document.documentElement.lang=lang;
   document.getElementById("uH").textContent=u.title;
   document.getElementById("uS").textContent=u.sub;
   if(LANGS.length>1){document.getElementById("lEn").classList.toggle("on",lang==="en");
   document.getElementById("lEs").classList.toggle("on",lang==="es");}
   document.getElementById("uPow").textContent=u.power;
   document.getElementById("uHelp").innerHTML=u.help+' <a href="mailto:'+EMAIL+'">'+EMAIL+'</a>';
   // intro
   document.getElementById("iEye").textContent=u.eyebrow;
   document.getElementById("iH").textContent=u.title;
   document.getElementById("iLead").textContent=u.lead;
   document.getElementById("iM1").textContent=u.m1;
   document.getElementById("iM2").textContent=u.m2;
   document.getElementById("iStart").textContent=u.start+"  →";
   // done
   document.getElementById("dH").textContent=u.doneT;
   document.getElementById("dD").textContent=u.doneD;
   document.getElementById("dReview").textContent=u.review;
   document.getElementById("dRestart").textContent=u.restart;
   // step
   if(idx>=0 && idx<N){
     const s=S[idx], last=(idx===N-1);
     document.getElementById("uProg").innerHTML=u.step+" <b>"+(idx+1)+"</b> "+u.of+" "+N;
     [...seg.children].forEach((c,k)=>{c.className=(k<idx?"done":k===idx?"cur":"");});
     document.getElementById("img").src=s.img;
     document.getElementById("stage").style.aspectRatio=s.ar;
     const cv=document.getElementById("canvas");
     cv.style.setProperty("--ox", s.cx+"%"); cv.style.setProperty("--oy", s.cy+"%");
     clearTimeout(zoomT);
     const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
     if(reduce || (s.z||1)===1){
       cv.style.transform="scale("+(s.z||1)+")";          // no zoom, or reduced-motion: snap
     }else{
       cv.style.transition="none"; cv.style.transform="scale(1)";  // 1) full view for context
       void cv.offsetWidth;                                        //    (force reflow)
       cv.style.transition="";
       zoomT=setTimeout(()=>{ cv.style.transform="scale("+s.z+")"; }, 430);  // 2) ease into target
     }
     const sp=document.getElementById("spot");
     if(s.noSpot){sp.style.display="none";}else{sp.style.display="";
     sp.style.left=(s.cx-s.w/2)+"%"; sp.style.top=(s.cy-s.h/2)+"%";
     sp.style.width=s.w+"%"; sp.style.height=s.h+"%";
     sp.classList.toggle("static", !!s.static);}
     document.querySelectorAll(".blur").forEach(e=>e.remove());
     if(s.blur){s.blur.forEach(b=>{const d=document.createElement("div");d.className="blur";d.style.left=(b.x)+"%";d.style.top=(b.y)+"%";d.style.width=(b.w)+"%";d.style.height=(b.h)+"%";const a=(b.a||8)+"px";d.style.backdropFilter="blur("+a+")";d.style.webkitBackdropFilter="blur("+a+")";document.getElementById("canvas").appendChild(d);});}
     document.getElementById("num").textContent=String(idx+1).padStart(2,"0");
     document.getElementById("cT").textContent=s[lang].t;
     document.getElementById("cD").textContent=s[lang].d;
     document.getElementById("bBack").textContent=u.back;
     document.getElementById("bNext").textContent=last?u.finish:u.next;
   }
 }
 function openLB(){ if(idx<0||idx>=N) return; document.getElementById("lbimg").src=S[idx].img; document.getElementById("lb").classList.add("open"); }
 function closeLB(){ document.getElementById("lb").classList.remove("open"); }
 function syncHash(){ const w=idx===-1?"#intro":idx===N?"#done":("#step-"+(idx+1)); if(location.hash!==w) history.replaceState(null,"",w); }
 function readHash(){ const h=(location.hash||"").replace("#",""); if(h==="done")idx=N; else if(h.indexOf("step-")===0){const k=parseInt(h.slice(5),10); idx=(k>=1&&k<=N)?k-1:-1;} else idx=-1; }

 document.getElementById("spot").addEventListener("click",e=>{ e.stopPropagation(); adv(); });
 document.getElementById("canvas").addEventListener("click",openLB);
 window.addEventListener("hashchange",()=>{ readHash(); render(true); });
 document.addEventListener("keydown",e=>{
   const open=document.getElementById("lb").classList.contains("open");
   if(e.key==="Escape"){ closeLB(); return; }
   if(open) return;
   if(e.key==="ArrowRight"){ if(idx<N) adv(); }
   if(e.key==="ArrowLeft"){ if(idx>-1) back(); }
 });
 readHash(); render(false);
</script>
</body>
</html>
