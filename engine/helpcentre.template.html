<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ============================================================
   Help centre — Coaches' Voice design system
   Palette and type from the CV Brand Guidelines 2026 tokens.
   The CV chrome (slate + orange) carries the page; the partner
   colour appears only on the crest and on club-specific callouts,
   so a coach reads "Coaches' Voice, for my club" rather than a
   club microsite that happens to mention CV.
   ============================================================ */

__GOTHAM_FACE__

:root{
  /* Brand — CV Guidelines p40 */
  --cv-slate:#333F48;
  --cv-orange:#FF6600;
  --cv-orange-600:#E55C00;

  /* Slate tints — p41 */
  --slate-lightest:#FAFBFC;
  --slate-light:#EBEEF1;
  --slate-dark:#1F272C;
  --slate-darkest:#08090B;

  /* Neutrals */
  --n-200:#EBEEF1; --n-300:#D8DEE3; --n-400:#B7C0C7;
  --n-500:#8791A0; --n-600:#5E6B76;

  /* Semantic */
  --fg-1:var(--cv-slate);
  --fg-2:var(--n-600);
  --fg-3:var(--n-500);
  --bg-1:#fff;
  --bg-2:var(--slate-lightest);
  --border-1:var(--n-200);
  --border-2:var(--n-300);

  /* Partner accent — the club's own colour, used sparingly */
  --partner:__PARTNER_COLOR__;

  /* Type */
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --font-display:"Gotham","Inter",-apple-system,BlinkMacSystemFont,sans-serif;

  /* Spacing, radii, elevation */
  --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px;
  --s-7:32px; --s-8:40px; --s-9:48px; --s-10:64px; --s-11:80px;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --shadow-1:0 1px 2px rgba(8,9,11,.06), 0 1px 1px rgba(8,9,11,.04);
  --shadow-2:0 2px 4px rgba(8,9,11,.06), 0 4px 12px rgba(8,9,11,.06);
  --shadow-focus:0 0 0 3px rgba(255,102,0,.25);
  --ease:cubic-bezier(.2,0,0,1);
  --dur:200ms;

  --margin:clamp(20px,4vw,48px);
  --measure:68ch;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
body{
  margin:0; background:var(--bg-2); color:var(--fg-1);
  font-family:var(--font-sans); font-size:16px; line-height:1.5;
  letter-spacing:-.005em; -webkit-font-smoothing:antialiased;
}
a{color:var(--cv-orange); text-decoration:none}
a:hover{color:var(--cv-orange-600)}
a:focus-visible, summary:focus-visible{outline:none; box-shadow:var(--shadow-focus); border-radius:var(--r-sm)}

/* ── nav: partner lockup, CV chrome ── */
nav{position:sticky; top:0; z-index:50; background:var(--slate-dark);
    border-bottom:1px solid rgba(255,255,255,.08)}
.navin{max-width:1120px; margin:0 auto; display:flex; align-items:center;
       gap:var(--s-6); padding:0 var(--margin); min-height:74px; flex-wrap:wrap}
.lockup{display:flex; align-items:center; gap:20px; padding:14px 0; flex:none}
.lockup .cv{height:23px; width:auto; display:block}
.lockup .rule{width:1px; height:34px; background:rgba(255,255,255,.28); border-radius:1px}
.lockup .crest{height:44px; width:auto; display:block}
.navspacer{flex:1}
.navlinks{display:flex; gap:var(--s-6); flex-wrap:wrap; padding-bottom:2px}
.navlinks a{color:rgba(255,255,255,.78); font-size:14px; font-weight:500;
            letter-spacing:-.01em; padding:6px 0; border-bottom:2px solid transparent;
            transition:color var(--dur) var(--ease), border-color var(--dur) var(--ease)}
.navlinks a:hover{color:#fff; border-bottom-color:var(--cv-orange)}
@media (max-width:760px){
  .navin{min-height:0; padding-top:10px; padding-bottom:10px; gap:var(--s-3)}
  .navspacer{display:none}
  .navlinks{width:100%; gap:var(--s-5)}
  .navlinks a{font-size:13px}
}

/* ── hero: dark slate with the brand halftone ── */
header{position:relative; background:var(--slate-dark); color:#fff; overflow:hidden}
header .dots{
  position:absolute; inset:0; pointer-events:none;
  background-image:radial-gradient(rgba(255,102,0,.5) 1px, transparent 1.4px);
  background-size:22px 22px;
  -webkit-mask-image:radial-gradient(120% 90% at 88% -10%, #000 0%, transparent 62%);
          mask-image:radial-gradient(120% 90% at 88% -10%, #000 0%, transparent 62%);
  opacity:.5;
}
.hin{position:relative; max-width:1120px; margin:0 auto;
     padding:var(--s-11) var(--margin) var(--s-10)}
.eyebrow{font-family:var(--font-sans); font-size:12px; font-weight:600;
         letter-spacing:.14em; text-transform:uppercase; color:var(--cv-orange); margin:0}
h1{font-family:var(--font-display); font-weight:500;
   font-size:clamp(38px,5.5vw,68px); line-height:.98; letter-spacing:-.05em;
   margin:var(--s-4) 0 var(--s-5); max-width:18ch; text-wrap:balance}
.lede{font-size:18px; line-height:1.55; color:rgba(255,255,255,.76);
      max-width:58ch; margin:0}
.lede strong{color:#fff; font-weight:600}
@media (max-width:640px){ .hin{padding:var(--s-9) var(--margin) var(--s-8)} .lede{font-size:16.5px} }

/* ── sections ── */
main{max-width:1120px; margin:0 auto; padding:0 var(--margin)}
section{padding:var(--s-10) 0 0; scroll-margin-top:76px}
section:last-of-type{padding-bottom:var(--s-9)}
.shd{display:flex; align-items:baseline; gap:var(--s-4); flex-wrap:wrap; margin-bottom:var(--s-3)}
h2{font-family:var(--font-display); font-weight:500; font-size:clamp(26px,3vw,36px);
   line-height:1; letter-spacing:-.045em; margin:0}
.shd .note{font-size:14px; color:var(--fg-3); letter-spacing:0}
.lead{font-size:16.5px; color:var(--fg-2); max-width:var(--measure); margin:0 0 var(--s-6)}
.lead + .lead{margin-top:calc(var(--s-6) * -1 + var(--s-4))}
.sub{font-family:var(--font-display); font-weight:500; font-size:17px;
     letter-spacing:-.03em; margin:var(--s-8) 0 var(--s-4)}

/* ── numbered steps ── */
.steps{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s-4)}
@media (max-width:900px){ .steps{grid-template-columns:1fr} }
.step{background:var(--bg-1); border:1px solid var(--border-1);
      border-radius:var(--r-md); padding:var(--s-6); box-shadow:var(--shadow-1)}
.step .n{width:28px; height:28px; border-radius:var(--r-sm); background:var(--cv-orange);
         color:#fff; display:grid; place-items:center; font-weight:600; font-size:14px;
         margin-bottom:var(--s-4); font-variant-numeric:tabular-nums}
.step h3{font-family:var(--font-display); font-weight:500; font-size:17px;
         letter-spacing:-.03em; margin:0 0 var(--s-2)}
.step p{margin:0; font-size:15px; color:var(--fg-2); line-height:1.5}
.step p + p{margin-top:var(--s-3)}
.step .small{font-size:13.5px; color:var(--fg-3)}
.url{display:inline-block; font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
     font-size:13px; background:var(--slate-light); border:1px solid var(--border-2);
     border-radius:var(--r-sm); padding:2px 8px; color:var(--cv-slate);
     font-weight:500; word-break:break-all; transition:border-color var(--dur) var(--ease)}
a.url:hover{border-color:var(--cv-orange); color:var(--cv-orange-600)}

/* ── FAQ ── */
.faq{background:var(--bg-1); border:1px solid var(--border-1);
     border-radius:var(--r-md); overflow:hidden; box-shadow:var(--shadow-1)}
details{border-bottom:1px solid var(--border-1)}
details:last-child{border-bottom:0}
summary{list-style:none; cursor:pointer; padding:var(--s-5) var(--s-6);
        font-family:var(--font-display); font-weight:500; font-size:16.5px;
        letter-spacing:-.025em; display:flex; align-items:center; gap:var(--s-4);
        transition:background var(--dur) var(--ease)}
summary::-webkit-details-marker{display:none}
summary:hover{background:var(--slate-lightest)}
summary .chev{margin-left:auto; flex:none; width:16px; height:16px;
              color:var(--n-400); transition:transform var(--dur) var(--ease), color var(--dur) var(--ease)}
details[open] summary{background:var(--slate-lightest)}
details[open] summary .chev{transform:rotate(90deg); color:var(--cv-orange)}
.qn{flex:none; width:8px; height:8px; border-radius:50%; background:var(--n-300);
    transition:background var(--dur) var(--ease)}
details[open] .qn{background:var(--cv-orange)}
.ans{padding:0 var(--s-6) var(--s-6) calc(var(--s-6) + 8px + var(--s-4));
     font-size:15.5px; color:var(--fg-2); line-height:1.6; max-width:var(--measure)}
.ans p{margin:0 0 var(--s-3)}
.ans p:last-child{margin-bottom:0}
.ans ul{margin:var(--s-3) 0; padding-left:var(--s-5)}
.ans li{margin-bottom:var(--s-3)}
.ans li:last-child{margin-bottom:0}
.ans strong{color:var(--fg-1); font-weight:600}
@media (max-width:560px){ .ans{padding-left:var(--s-6)} }

/* ── cards ── */
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(272px,1fr));
       gap:var(--s-4); margin-top:var(--s-4)}
.card{display:block; background:var(--bg-1); border:1px solid var(--border-1);
      border-radius:var(--r-md); padding:var(--s-5) var(--s-6); color:inherit;
      box-shadow:var(--shadow-1);
      transition:border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease)}
.card:hover{border-color:var(--cv-orange); box-shadow:var(--shadow-2); transform:translateY(-2px)}
.card .who{display:block; font-size:11px; font-weight:600; letter-spacing:.11em;
           text-transform:uppercase; color:var(--cv-orange); margin-bottom:var(--s-2)}
.card .tt{display:block; font-family:var(--font-display); font-weight:500; font-size:16px;
          letter-spacing:-.03em; color:var(--fg-1); margin-bottom:6px}
.card .td{display:block; font-size:14px; color:var(--fg-2); line-height:1.45}
.card.vid .who{color:var(--fg-3)}
.card.vid .tt::before{content:"▶"; color:var(--cv-orange); font-size:10px;
                      margin-right:8px; vertical-align:2px}

/* ── bookmark: the one thing on the page we actively want them to DO ──
   Louder than a card on purpose. As a plain card it read as one more link
   and went unnoticed, which defeats the point of it. */
.bookmark{display:flex; gap:var(--s-5); align-items:flex-start;
          background:rgba(255,102,0,.055); border:1px solid rgba(255,102,0,.28);
          border-left:4px solid var(--cv-orange); border-radius:var(--r-md);
          padding:var(--s-6) var(--s-7); margin-top:var(--s-6); max-width:var(--measure)}
.bookmark .ico{flex:none; width:34px; height:34px; border-radius:var(--r-sm);
               background:var(--cv-orange); display:grid; place-items:center; margin-top:1px}
.bookmark .ico svg{width:17px; height:17px; fill:#fff}
.bookmark h3{font-family:var(--font-display); font-weight:500; font-size:17px;
             letter-spacing:-.03em; color:var(--fg-1); margin:0 0 var(--s-2)}
.bookmark p{font-size:15px; color:var(--fg-2); line-height:1.5; margin:0}
.bookmark p strong{color:var(--fg-1); font-weight:600}
.bookmark a.link{display:inline-block; margin-top:var(--s-4);
                 font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
                 font-size:13px; font-weight:500; color:var(--cv-orange);
                 background:#fff; border:1px solid rgba(255,102,0,.35);
                 border-radius:var(--r-sm); padding:7px 12px; word-break:break-all;
                 transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease)}
.bookmark a.link:hover{background:var(--cv-orange); border-color:var(--cv-orange); color:#fff}
@media (max-width:560px){ .bookmark{padding:var(--s-5); gap:var(--s-4)} }

/* ── callout: the club's own voice, so it wears the club's colour ── */
.callout{background:var(--bg-1); border:1px solid var(--border-1);
         border-left:3px solid var(--partner); border-radius:var(--r-md);
         padding:var(--s-5) var(--s-6); margin-top:var(--s-5);
         font-size:15.5px; color:var(--fg-2); line-height:1.55; max-width:var(--measure);
         box-shadow:var(--shadow-1)}
.callout strong{color:var(--fg-1); font-weight:600}

/* ── footer ── */
footer{margin-top:var(--s-10); background:var(--slate-dark); color:rgba(255,255,255,.7)}
.fin{max-width:1120px; margin:0 auto; padding:var(--s-8) var(--margin);
     display:flex; align-items:center; gap:var(--s-6); flex-wrap:wrap}
.fin .cvfoot{height:22px; width:auto; opacity:.9}
.fin p{margin:0; font-size:13px; letter-spacing:.01em}

</style>
</head>
<body>

<nav>
  <div class="navin">
    <a class="lockup" href="#top" aria-label="__PARTNER_NAME__ &mdash; Coaches&rsquo; Voice">
      <img class="cv" src="__CV_LOGO__" alt="Coaches&rsquo; Voice">
      <span class="rule" aria-hidden="true"></span>
      <img class="crest" src="__LOGO__" alt="__PARTNER_NAME__">
    </a>
    <span class="navspacer"></span>
    <div class="navlinks">
__NAV__
    </div>
  </div>
</nav>

<header id="top">
  <div class="dots" aria-hidden="true"></div>
  <div class="hin">
    <p class="eyebrow">__EYEBROW__</p>
    <h1>__H1__</h1>
    <p class="lede">__LEAD__</p>
  </div>
</header>

<main>
__SECTIONS__
</main>

<footer>
  <div class="fin">
    <img class="cvfoot" src="__CV_LOGO__" alt="Coaches&rsquo; Voice">
    <p>__FOOTER__</p>
  </div>
</footer>

<script>
 /* one open at a time, per accordion group */
 document.querySelectorAll('.faq').forEach(function(group){
   var all = group.querySelectorAll('details');
   all.forEach(function(d){
     d.addEventListener('toggle', function(){
       if(!d.open) return;
       all.forEach(function(o){ if(o !== d) o.open = false; });
     });
   });
 });

 /* deep-link to a question: #<section>-3 opens the 3rd item of that section */
 (function(){
   var m = (location.hash || '').match(/^#([a-z0-9-]+)-(\d+)$/);
   if(!m) return;
   var sec = document.getElementById(m[1]);
   if(!sec) return;
   var d = sec.querySelectorAll('details')[parseInt(m[2],10) - 1];
   if(d){ d.open = true; d.scrollIntoView({behavior:'smooth', block:'center'}); }
 })();
</script>

<script>
 /* broadcast height to a parent frame (e.g. Freshdesk) for auto-resize */
 (function(){
   if(window.parent === window) return;
   function send(){ parent.postMessage({tutorialHeight: document.documentElement.scrollHeight + 32}, '*'); }
   send(); window.addEventListener('load', send); window.addEventListener('resize', send);
   new MutationObserver(send).observe(document.body, {childList:true, subtree:true, attributes:true});
 })();
</script>
</body>
</html>
