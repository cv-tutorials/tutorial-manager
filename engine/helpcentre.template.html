<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
   --red:__PRIMARY__; --red-dk:__PRIMARY_DK__;
   --ink:__INK__; --ink-2:#1F2A3A; --soft:#5B6675;
   --line:#E6E8EC; --bg:#F6F7F9; --white:#fff;
   --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 }
 *{box-sizing:border-box;margin:0;padding:0}
 html{scroll-behavior:smooth}
 body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.55}

 /* ── nav ── */
 nav{position:sticky;top:0;z-index:50;background:var(--red);box-shadow:0 1px 0 rgba(0,0,0,.08)}
 .navin{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:22px;padding:0 24px;height:58px}
 .navin img.crest{height:34px;width:auto;filter:brightness(0) invert(1)}
 .navin a{color:#fff;text-decoration:none;font-size:13.5px;font-weight:600;letter-spacing:.1px;opacity:.92;padding:6px 0;border-bottom:2px solid transparent}
 .navin a:hover{opacity:1;border-bottom-color:rgba(255,255,255,.75)}
 .navspacer{flex:1}
 .navtag{color:#fff;opacity:.8;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
 @media (max-width:720px){ .navin{gap:14px;padding:0 14px} .navtag{display:none} .navin a{font-size:12.5px} }

 /* ── hero ── */
 header{background:var(--white);border-bottom:1px solid var(--line)}
 .hin{max-width:1080px;margin:0 auto;padding:44px 24px 40px;display:flex;gap:34px;align-items:center}
 .hin img{height:104px;width:auto;flex:none}
 .eyebrow{font-size:11.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--red)}
 .hin h1{font-size:38px;font-weight:900;letter-spacing:-1.1px;line-height:1.05;margin:9px 0 12px}
 .hin p{font-size:16px;color:var(--soft);max-width:62ch}
 @media (max-width:720px){ .hin{flex-direction:column;align-items:flex-start;gap:20px;padding:30px 18px} .hin img{height:72px} .hin h1{font-size:28px} }

 /* ── layout ── */
 main{max-width:1080px;margin:0 auto;padding:0 24px 10px}
 @media (max-width:720px){ main{padding:0 18px 10px} }
 section{padding:44px 0 6px;scroll-margin-top:70px}
 .shd{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
 .shd h2{font-size:24px;font-weight:900;letter-spacing:-.6px}
 .shd .note{font-size:13px;color:var(--soft)}
 .lead{font-size:15px;color:var(--soft);max-width:70ch;margin-bottom:22px}

 /* ── numbered steps ── */
 .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
 @media (max-width:860px){ .steps{grid-template-columns:1fr} }
 .step{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:20px}
 .step .n{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px;margin-bottom:12px}
 .step h3{font-size:15.5px;font-weight:800;margin-bottom:6px}
 .step p{font-size:14px;color:var(--ink-2)}
 .step p + p{margin-top:8px}
 .step .small{font-size:13px;color:var(--soft)}
 .url{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;color:var(--red);font-weight:600;text-decoration:none}
 a.url:hover{border-color:var(--red);background:#FFF5F5}

 /* ── FAQ accordion ── */
 .faq{background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden}
 details{border-bottom:1px solid var(--line)}
 details:last-child{border-bottom:0}
 summary{list-style:none;cursor:pointer;padding:16px 20px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:12px;transition:background .12s}
 summary::-webkit-details-marker{display:none}
 summary:hover{background:#FCFCFD}
 summary .chev{margin-left:auto;flex:none;width:16px;height:16px;color:var(--soft);transition:transform .18s}
 details[open] summary{background:#FFF5F5}
 details[open] summary .chev{transform:rotate(90deg);color:var(--red)}
 .ans{padding:2px 20px 20px 52px;font-size:14.5px;color:var(--ink-2)}
 .ans p + p{margin-top:10px}
 .ans ul{margin:10px 0 0 18px}
 .ans li{margin-bottom:7px}
 .ans strong{color:var(--ink)}
 @media (max-width:560px){ .ans{padding-left:20px} }
 .qn{flex:none;width:24px;height:24px;border-radius:7px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:11.5px;font-weight:800;color:var(--soft)}
 details[open] .qn{background:var(--red);border-color:var(--red);color:#fff}

 /* ── link cards ── */
 .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:16px}
 .card{display:block;background:var(--white);border:1px solid var(--line);border-radius:13px;padding:17px 18px;text-decoration:none;color:inherit;transition:.14s}
 .card:hover{border-color:var(--red);transform:translateY(-1px);box-shadow:0 6px 18px -12px rgba(0,0,0,.35)}
 .card .who{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--red);margin-bottom:7px}
 .card .tt{display:block;font-size:15px;font-weight:800;margin-bottom:5px}
 .card .td{display:block;font-size:13.5px;color:var(--soft)}

 /* ── callout ── */
 .sub{font-size:14px;font-weight:800;letter-spacing:.2px;margin:22px 0 -4px}
 .card.vid .who{color:var(--soft)}
 .card.vid .tt::before{content:"▶";color:var(--red);font-size:11px;margin-right:7px;vertical-align:1px}
 .callout{background:#FFF5F5;border:1px solid #F5C9C9;border-left:4px solid var(--red);border-radius:12px;padding:16px 18px;font-size:14.5px;color:var(--ink-2);margin-top:16px}
 .callout strong{color:var(--ink)}

 /* ── footer ── */
 footer{margin-top:40px;border-top:1px solid var(--line);background:var(--white)}
 .fin{max-width:1080px;margin:0 auto;padding:26px 24px 34px;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}
 .fin .h{font-size:14px;color:var(--ink-2)}
 .fin .h a{color:var(--red);font-weight:700;text-decoration:none}
 .fin .p{font-size:11px;text-transform:uppercase;letter-spacing:.9px;font-weight:800;color:var(--soft)}
</style>
</head>
<body>

<nav>
  <div class="navin">
    <img class="crest" src="__LOGO__" alt="__PARTNER_NAME__">
__NAV__
    <span class="navspacer"></span>
    <span class="navtag">Powered by Coaches&rsquo; Voice</span>
  </div>
</nav>

<header>
  <div class="hin">
    <img src="__LOGO__" alt="" aria-hidden="true">
    <div>
      <p class="eyebrow">__EYEBROW__</p>
      <h1>__H1__</h1>
      <p>__LEAD__</p>
    </div>
  </div>
</header>

<main>
__SECTIONS__
</main>

<footer>
  <div class="fin">
    <span class="p">__FOOTER__</span>
    <span class="h">Powered by <a href="https://www.coachesvoice.com">Coaches&rsquo; Voice</a></span>
  </div>
</footer>

<script>
 /* one open at a time, per accordion group */
 document.querySelectorAll('.faq').forEach(function(group){
   var all = group.querySelectorAll('details');
   all.forEach(function(d){
     d.addEventListener('toggle', function(){
       if(!d.open) return;
       all.forEach(function(o){ if(o !== d) o.open = false; });
     });
   });
 });

 /* deep-link to a question: #<section>-3 opens the 3rd item of that section */
 (function(){
   var m = (location.hash || '').match(/^#([a-z0-9-]+)-(\d+)$/);
   if(!m) return;
   var sec = document.getElementById(m[1]);
   if(!sec) return;
   var d = sec.querySelectorAll('details')[parseInt(m[2],10) - 1];
   if(d){ d.open = true; d.scrollIntoView({behavior:'smooth', block:'center'}); }
 })();
</script>

<script>
 /* broadcast height to a parent frame (e.g. Freshdesk) for auto-resize */
 (function(){
   if(window.parent === window) return;
   function send(){ parent.postMessage({tutorialHeight: document.documentElement.scrollHeight + 32}, '*'); }
   send(); window.addEventListener('load', send); window.addEventListener('resize', send);
   new MutationObserver(send).observe(document.body, {childList:true, subtree:true, attributes:true});
 })();
</script>
</body>
</html>
